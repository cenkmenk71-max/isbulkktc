name: Lane autopilot

# Runs the lane autopilot on a schedule, so the team keeps working without a
# human in the loop. One pass per lane: read its real state and decide
# spawn / respawn / wait / blocked / exhausted / deferred.
#
# It never writes to `main`. Lanes land by pull request, and the autopilot only
# reads PRs and issues and calls the OpenHands API.
#
# Needs the OPENHANDS_API_KEY repository secret. Without it the job fails fast
# rather than pretending to run.

on:
  schedule:
    # GitHub's scheduler is best-effort: under load it delays a run by tens of
    # minutes, so `*/30` was observed firing every ~55 minutes. Two offset
    # entries raise the chance of one landing near the intended time. The pass
    # is idempotent, so a duplicate run is harmless.
    - cron: '*/20 * * * *'
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Decide only, start nothing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: lane-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    name: One autopilot pass
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # The autopilot keeps its per-lane attempt counters in `.lane-state.json`,
      # which `.gitignore` excludes. On a fresh runner that file would start
      # empty every pass, so `maxAttemptsPerLane` would never fire and a lane
      # could be re-spawned forever — the exact token leak in issue #218. Cache
      # it between scheduled runs; the run_id suffix makes each pass save a new
      # immutable cache that the next pass restores, so the counters accumulate.
      - name: Restore lane autopilot state
        uses: actions/cache/restore@v4
        with:
          path: .lane-state.json
          key: lane-state-${{ github.run_id }}
          restore-keys: |
            lane-state-

      - name: Run one pass
        env:
          # The autopilot reads PRs and issues through gh, and calls the
          # OpenHands API. The default token can read both, so it is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${OPENHANDS_API_KEY:-}" ]; then
            echo "::error::OPENHANDS_API_KEY is not set as a repository secret"
            exit 1
          fi
          args=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="--dry-run"
          fi
          node scripts/lane-autopilot.mjs $args

      - name: Save lane autopilot state
        # A dry run (and a pass that started nothing) never writes the file;
        # `cache/save` errors when its path is absent, so skip it then.
        if: always() && hashFiles('.lane-state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .lane-state.json
          key: lane-state-${{ github.run_id }}
