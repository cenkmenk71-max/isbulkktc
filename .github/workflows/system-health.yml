name: System health

# The production and CI health check. It confirms the scheduled check is firing
# and that nothing is stuck, so a silent stall is caught by the system rather
# than by the owner noticing.
#
# It fails the job when something is broken, which is what makes it useful: a
# green run means the machinery is healthy, not merely that the script exited.

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

jobs:
  health:
    name: Health check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Run the health check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The secret-shape check (#209) reads these; without them it is blind
          # in the scheduled run it was written for (#596). Both are already
          # defined for `verify-production-deployment.yml`.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # The origin channel is blocked from runners (Cloudflare 403), so the
          # deploy-freshness check reads the Vercel API's production alias
          # instead (#590). Without the token the run reports the deploy as
          # unmeasurable rather than measuring nothing.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || 'orijin1' }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'isbulkktc' }}
        run: node scripts/system-health.mjs
