name: Send engagement digest

# Drives the weekly "jobs picked for you" digest, which a cron — and only a cron
# — is meant to call. Like the acquisition sender, the route existed, was
# deployed, and answered 401 to everyone because nothing ever presented the
# bearer secret.
#
# The route returns one bounded keyset page per HTTP request. This workflow
# follows the cursor until every recipient was processed. A UTC-week key keeps
# request IDs stable, but Resend retains idempotency keys for only 24 hours, so
# blind retries after that window can duplicate already-sent messages. It is separate from the acquisition campaign on
# purpose: two `schedule` entries in one workflow fire *both* jobs on *every*
# cron, which would send the weekly digest daily.
#
# Requires the route's bearer secret as a repository secret. The ingress origin
# is a dedicated DNS-only Vercel custom hostname and is intentionally fixed here
# rather than read from an editable repository variable.
on:
  schedule:
    # Mondays at 07:00 UTC (10:00 KKTC), a low-traffic window for a weekly digest.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engagement-digest
  cancel-in-progress: false

jobs:
  send:
    name: Send engagement digest
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check configuration
        id: config
        env:
          CRON_SECRET: ${{ secrets.ENGAGEMENT_CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=Engagement digest misconfigured::ENGAGEMENT_CRON_SECRET is required."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Send the engagement digest
        if: steps.config.outputs.configured == 'true'
        env:
          CRON_SECRET: ${{ secrets.ENGAGEMENT_CRON_SECRET }}
          # Dedicated DNS-only Vercel custom hostname. The application Proxy
          # restricts this host to the exact authenticated mail POST routes.
          DISPATCH_ORIGIN: https://hooks.isbulkktc.com
        run: |
          set -euo pipefail
          cursor=""
          total_sent=0
          total_failed=0
          page=0

          while true; do
            page=$((page + 1))
            url="${DISPATCH_ORIGIN%/}/api/email/engagement-digest"
            if [ -n "$cursor" ]; then
              url="${url}?after=${cursor}"
            fi

            status=$(curl -sS --connect-timeout 10 --max-time 75 \
              -o /tmp/engagement-response.txt -w '%{http_code}' \
              -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$url")
            echo "Page ${page}: HTTP ${status}"
            cat /tmp/engagement-response.txt

            # A 503 indicates a production configuration or availability
            # failure. An empty recipient page is a successful HTTP 200.
            if [ "$status" != "200" ]; then
              echo "::error::Engagement digest page ${page} failed with HTTP ${status}."
              exit 1
            fi

            complete=$(jq -er '.complete | tostring' /tmp/engagement-response.txt)
            next_cursor=$(jq -r '.nextCursor // ""' /tmp/engagement-response.txt)
            sent=$(jq -er '.sent | numbers' /tmp/engagement-response.txt)
            failed=$(jq -er '.failed | numbers' /tmp/engagement-response.txt)
            total_sent=$((total_sent + sent))
            total_failed=$((total_failed + failed))

            echo "Page ${page}: sent=${sent} failed=${failed} complete=${complete}"

            if [ "$complete" = "true" ]; then
              break
            fi
            if [ -z "$next_cursor" ] || [ "$next_cursor" = "$cursor" ]; then
              echo "::error::The recipient cursor did not advance; refusing an infinite workflow loop."
              exit 1
            fi
            cursor="$next_cursor"
          done

          echo "Engagement digest finished: pages=${page} sent=${total_sent} failed=${total_failed}"
          if [ "$total_failed" -gt 0 ]; then
            echo "::error::Some engagement emails failed. A retry is duplicate-safe only within Resend\x27s 24-hour idempotency window; after that, reconcile sends before retrying."
            exit 1
          fi
