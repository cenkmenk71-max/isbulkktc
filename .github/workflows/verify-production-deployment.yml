name: Verify production deployment

# The Vercel Git integration deploys `main` on every push, but CI only proves the
# code is *buildable* — not that the live site is actually serving it. A failed
# Vercel build, an alias left pinned to the previous deployment, or an app that
# boots and then errors at request time all keep the Actions tab green while the
# site quietly serves stale code. This workflow closes that loop.
#
# It confirms the deploy through two independent channels and passes if either
# succeeds:
#   1. the Vercel API (with VERCEL_TOKEN) — the commit behind the deployment the
#      production alias points at;
#   2. the live origin's `/api/build-info`.
#
# The HTTP channel is important to get right: `isbulkktc.com` is fronted by
# Cloudflare, which answers GitHub runners' datacenter IPs with **403**. That is
# not an outage, so a 403 there is classified as "blocked" and skipped — never a
# failure. The Vercel API channel is what carries the verdict from CI.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expect:
        description: "Commit SHA to expect on production (defaults to the checked-out HEAD)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: verify-production-deployment
  # Back-to-back pushes to main are common (a merge lands on top of a merge). The
  # older run cannot ever see its commit on production, so cancel it instead of
  # letting it poll for 15 minutes and then paint a healthy site red.
  cancel-in-progress: true

jobs:
  verify:
    name: Verify the live site serves the pushed commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Resolve the expected commit
        id: expect
        env:
          INPUT_EXPECT: ${{ inputs.expect }}
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          expected="${INPUT_EXPECT:-$PUSH_SHA}"
          if [ -z "$expected" ]; then
            expected="$(git rev-parse HEAD)"
          fi
          echo "sha=$expected" >> "$GITHUB_OUTPUT"
          echo "Verifying production serves $expected"

      - name: Resolve the branch tip
        id: tip
        if: github.event_name == 'push'
        run: |
          # `git ls-remote` reads the live remote ref without needing history, so
          # it reports the current head of main even if a newer merge landed
          # while this run was queued.
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          echo "sha=$tip" >> "$GITHUB_OUTPUT"
          echo "Current main tip is $tip"

      - name: Verify the deployment
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://isbulkktc.com' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || secrets.VERCEL }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || 'orijin1' }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'isbulkktc' }}
          DEPLOY_TIMEOUT_SEC: ${{ vars.DEPLOY_TIMEOUT_SEC || '900' }}
          DEPLOY_POLL_SEC: ${{ vars.DEPLOY_POLL_SEC || '20' }}
        # On a push, `--tip` lets the script skip when a newer commit already owns
        # main. A manual run passes no tip: the caller named the commit explicitly
        # and means to verify it even if it is no longer the tip.
        run: node scripts/verify-production-deployment.mjs --expect "${{ steps.expect.outputs.sha }}" --tip "${{ steps.tip.outputs.sha }}"
