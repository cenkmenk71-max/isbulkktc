name: Send acquisition campaign

# Drives the acquisition sender, which a cron — and only a cron — is meant to
# call. The route existed, was deployed, and answered 401 to everyone, because
# nothing ever presented the bearer secret: the acquisition family had no
# traffic at all, which is the whole point of this workflow.
#
# The route returns one bounded keyset page per request. This workflow follows
# the cursor until the queue is empty; successful leads are marked `contacted`,
# while send/state-update failures remain visible as a failed run. Resend
# idempotency keys are stable within the selected UTC campaign date (24-hour
# provider retention), not a permanent delivery ledger.
#
# Requires the route's bearer secret as a repository secret. The ingress origin
# is a dedicated DNS-only Vercel custom hostname and is intentionally fixed here
# rather than read from an editable repository variable.
on:
  schedule:
    # Daily at 06:00 UTC (09:00 KKTC). A lead is mailed once and then marked
    # `contacted`, so the cadence advances a consented queue rather than
    # re-mailing it.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      campaign_date:
        description: "UTC campaign date. Reuse the original date for a retry within Resend's 24-hour idempotency window."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: acquisition-campaign
  cancel-in-progress: false

jobs:
  send:
    name: Send acquisition campaign
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check configuration
        id: config
        env:
          CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error title=Acquisition campaign misconfigured::MARKETING_CRON_SECRET is required."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Send the acquisition campaign
        if: steps.config.outputs.configured == 'true'
        env:
          CRON_SECRET: ${{ secrets.MARKETING_CRON_SECRET }}
          INPUT_CAMPAIGN_DATE: ${{ inputs.campaign_date }}
          # DNS-only Vercel custom hostname: bypasses Cloudflare Bot Fight Mode
          # without disabling it zone-wide, and is excluded from deployment SSO.
          # The application Proxy restricts this host to this exact POST route,
          # the engagement sender, and the Svix webhook receiver.
          DISPATCH_ORIGIN: https://hooks.isbulkktc.com
        run: |
          set -euo pipefail
          campaign_date="${INPUT_CAMPAIGN_DATE:-$(date -u +%F)}"
          if ! [[ "$campaign_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
             [ "$(date -u -d "$campaign_date" +%F 2>/dev/null || true)" != "$campaign_date" ]; then
            echo "::error::campaign_date must be a real YYYY-MM-DD UTC date."
            exit 1
          fi

          cursor=""
          total_sent=0
          total_failed=0
          page=0

          while true; do
            page=$((page + 1))
            url="${DISPATCH_ORIGIN%/}/api/email/acquisition-campaign?campaignDate=${campaign_date}"
            if [ -n "$cursor" ]; then
              url="${url}&after=${cursor}"
            fi

            status=$(curl -sS --connect-timeout 10 --max-time 75 \
              -o /tmp/acquisition-response.txt -w '%{http_code}' \
              -X POST -H "Authorization: Bearer ${CRON_SECRET}" "$url")
            echo "Page ${page}: HTTP ${status}"
            cat /tmp/acquisition-response.txt

            # A 503 can mean the consent schema is not ready. Treat it as a
            # failed run, never as a successful empty campaign.
            if [ "$status" != "200" ]; then
              echo "::error::Acquisition campaign page ${page} failed with HTTP ${status}."
              exit 1
            fi

            complete=$(jq -er '.complete | tostring' /tmp/acquisition-response.txt)
            next_cursor=$(jq -r '.nextCursor // ""' /tmp/acquisition-response.txt)
            response_date=$(jq -er '.campaignDate' /tmp/acquisition-response.txt)
            sent=$(jq -er '.sent | numbers' /tmp/acquisition-response.txt)
            failed=$(jq -er '.failed | numbers' /tmp/acquisition-response.txt)
            if [ "$response_date" != "$campaign_date" ]; then
              echo "::error::The server changed the campaign idempotency date between pages."
              exit 1
            fi
            total_sent=$((total_sent + sent))
            total_failed=$((total_failed + failed))
            echo "Page ${page}: sent=${sent} failed=${failed} complete=${complete}"

            if [ "$complete" = "true" ]; then
              break
            fi
            if [ -z "$next_cursor" ] || [ "$next_cursor" = "$cursor" ]; then
              echo "::error::The recipient cursor did not advance; refusing an infinite workflow loop."
              exit 1
            fi
            cursor="$next_cursor"
          done

          echo "Acquisition campaign finished: pages=${page} sent=${total_sent} failed=${total_failed}"
          if [ "$total_failed" -gt 0 ]; then
            echo "::error::Some sends or lead-state updates failed. The affected leads remain queued; reconcile within the 24-hour idempotency window before retrying with campaign_date=${campaign_date}."
            exit 1
          fi
