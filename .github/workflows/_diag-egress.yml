name: _diag egress
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe canonical and alias from the runner
        run: |
          for u in "https://isbulkktc.com/sitemap.xml" "https://isbulkktc.com/" "https://isbulkktc-amber.vercel.app/sitemap.xml" "https://isbulkktc.vercel.app/"; do
            echo "===== $u"
            curl -sS -o /dev/null -D - --max-time 25 "$u" 2>&1 | grep -iE '^HTTP/|^location:|^server:|^cf-|^x-vercel|^x-robots-tag|^content-type:' | sed 's/^/  /'
          done
          echo "===== cdn-cgi/trace"
          curl -sS --max-time 25 https://isbulkktc.com/cdn-cgi/trace | grep -E '^(ip|loc|colo|warp)='
          echo "===== alias UA node"
          curl -sS -o /dev/null -w 'alias sitemap node-UA=%{http_code}\n' --max-time 25 -A node https://isbulkktc-amber.vercel.app/sitemap.xml
