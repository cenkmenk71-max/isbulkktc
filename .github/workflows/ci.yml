name: isbulkktc CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  app:
    name: Type check, lint, unit, build and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Validate form schemas
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Start the isolated local Supabase stack
        run: npm run db:start

      - name: Apply migrations and run pgTAP tests
        run: npm run test:db

      - name: Stop the local Supabase stack
        if: always()
        run: npm run db:stop -- --no-backup
