name: isbulkktc CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  app:
    name: Type check, lint, unit, build and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun run security:audit

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Validate form schemas
        run: bun run test:unit

      - name: Build
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: End-to-end tests
        run: bun run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  database:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        id: supabase_cli
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Start the isolated local Supabase stack
        run: bun run db:start

      - name: Apply migrations and run pgTAP tests
        run: bun run test:db

      - name: Stop the local Supabase stack
        if: always() && steps.supabase_cli.outcome == 'success'
        run: bun run db:stop -- --no-backup
