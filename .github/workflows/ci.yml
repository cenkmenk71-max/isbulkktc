name: isbulkktc CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: isbulkktc-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Quality, database and E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: $HOME/.bun/bin/bun audit --prod --audit-level=moderate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Frontend source and design-token gate
        run: bun run check:frontend-source

      - name: Unit tests
        run: bun run test:unit

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chrome

      - name: Set up Supabase CLI
        id: supabase_cli
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0

      - name: Start the seeded local Supabase stack
        id: supabase_start
        run: bun run db:start

      - name: Configure local Supabase credentials for E2E
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase.env
          set -a
          source /tmp/supabase.env
          set +a
          test -n "${API_URL:-}"
          key="${PUBLISHABLE_KEY:-${ANON_KEY:-}}"
          test -n "$key"
          service_role="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          test -n "$service_role"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$API_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$key"
            # The invite E2E drives the admin endpoint, which needs the
            # service-role key; without it that test skips silently.
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role"
            printf 'SUPABASE_MAILCATCHER_URL=%s\n' "${MAILPIT_URL:-${INBUCKET_URL:-}}"
          } >> "$GITHUB_ENV"

      - name: Apply migrations and run pgTAP tests
        run: bun run test:db

      - name: Build production standalone server
        run: |
          bun run build
          mkdir -p .next/standalone/.next .next/standalone/public
          cp -a .next/static/. .next/standalone/.next/static/
          cp -a public/. .next/standalone/public/
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: End-to-end tests against seeded Supabase
        run: bun run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Stop local Supabase stack
        if: always() && steps.supabase_cli.outcome == 'success' && steps.supabase_start.outcome != 'skipped'
        run: bun run db:stop -- --no-backup
