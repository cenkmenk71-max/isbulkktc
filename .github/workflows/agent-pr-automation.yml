name: Lane PR automation

# Opt-in merge automation for the parallel "lane" programme (docs/lanes/).
#
# The lane contract reserves the merge decision for the owner, so nothing here
# merges a PR unless the `agent:automerge` label is present. That label is the
# owner's standing instruction for a specific PR.
#
# History: this workflow also rebased the branch onto `main` on every event, to
# satisfy the strict "branch must be up to date" protection rule. That rule is
# now off — it made every merge invalidate every open PR, so a queue of six
# lanes left the last one waiting about forty-five minutes for a check that
# mostly repeated work. The rebase step went with it: without strict, rebasing
# only re-runs CI for no benefit. Full CI is still required on every PR, and
# `main` still runs CI on every push, so an integration problem surfaces on
# `main` immediately rather than blocking the queue.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: lane-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automate:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'agent:automerge')
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          # Waits for the required check, so a PR only lands when CI is green.
          gh pr merge "$pr" --repo "${{ github.repository }}" --squash --auto
