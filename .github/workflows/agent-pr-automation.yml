name: Lane PR automation

# Automation for the parallel "lane" programme (see docs/lanes/).
#
# Two independent, opt-in behaviours, each keyed on a label so the owner keeps
# the merge decision the lane contract reserves for them:
#
#   `agent`            -> keep the branch rebased on `main` so the strict
#                         "branch must be up to date" protection rule holds.
#                         A conflicting branch makes `update-branch` fail and
#                         the PR stays blocked for a human to split.
#   `agent:automerge`  -> also turn on squash auto-merge, so the PR lands by
#                         itself once `Quality, database and E2E` is green.
#                         Add this only when unattended merge is wanted.
#
# It never writes to `main`; the PR is the only path.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automate:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    steps:
      - name: Keep the branch current with main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          # Fails when the branch conflicts with main; leave the PR for a human.
          if ! gh pr update-branch "$pr" --repo "${{ github.repository }}"; then
            echo "::warning::PR #$pr conflicts with main and was left for a human"
          fi

      - name: Enable squash auto-merge (opt-in)
        if: contains(github.event.pull_request.labels.*.name, 'agent:automerge')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ github.event.pull_request.number }}"
          gh pr merge "$pr" --repo "${{ github.repository }}" --squash --auto
