name: Email preview gallery
on:
  push:
    branches:
      - preview/email-gallery-2026-11-20
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render every email template
        run: node --experimental-strip-types scripts/email-preview.mjs
      - name: Upload rendered HTML gallery
        uses: actions/upload-artifact@v4
        with:
          name: isbulkktc-email-previews
          path: .artifacts/email-preview/
          if-no-files-found: error
          retention-days: 1
