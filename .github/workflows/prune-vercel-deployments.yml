name: Prune Vercel deployments

# Vercel keeps a bounded number of stored deployments per project; once the cap
# is hit it stops accepting new builds and mails the owner that the quota is
# full. This job trims the backlog on a schedule so that never happens, while
# always preserving the live production deployment, recent rollback history and
# recent preview builds.
#
# It needs one repository secret, VERCEL_TOKEN (a token that can read the team
# and delete deployments). Until that secret exists the job stays green and
# emits a warning annotation instead of failing every night.
on:
  schedule:
    # Every six hours. A single daily run is not enough: active branches can
    # produce dozens of deployments a day, which is what fills the quota in the
    # first place. Four runs a day keeps the backlog far below the cap.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete deployments (uncheck for a dry-run)"
        type: boolean
        default: true
      keep_production:
        description: "Newest production deployments to keep"
        type: string
        default: "5"
      keep_preview:
        description: "Newest preview deployments to keep"
        type: string
        default: "5"
      min_age_hours:
        description: "Never prune anything newer than this many hours"
        type: string
        default: "1"

permissions:
  contents: read

concurrency:
  group: prune-vercel-deployments
  cancel-in-progress: false

jobs:
  prune:
    name: Prune old deployments
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Vercel prune not configured::Add the VERCEL_TOKEN repository secret (Settings > Secrets and variables > Actions > Secrets) to enable scheduled deployment cleanup. Skipping this run."
          fi

      - name: Check out source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Prune deployments
        if: steps.config.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || 'orijin1' }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT || 'isbulkktc' }}
          VERCEL_KEEP_PRODUCTION: ${{ inputs.keep_production || vars.VERCEL_KEEP_PRODUCTION || '5' }}
          VERCEL_KEEP_PREVIEW: ${{ inputs.keep_preview || vars.VERCEL_KEEP_PREVIEW || '5' }}
          VERCEL_MIN_AGE_HOURS: ${{ inputs.min_age_hours || vars.VERCEL_MIN_AGE_HOURS || '1' }}
          VERCEL_MAX_DELETES: ${{ vars.VERCEL_MAX_DELETES || '200' }}
        # Scheduled runs apply; a manual run defaults to apply but can dry-run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" != "true" ]; then
            node scripts/prune-vercel-deployments.mjs
          else
            node scripts/prune-vercel-deployments.mjs --apply
          fi
