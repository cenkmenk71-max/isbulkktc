name: Refresh source jobs

# Keeps the public job catalogue in step with the upstream listings. The import
# script is the same one run by hand (`bun run import:source-jobs`), so there is
# a single code path for fetching, sanitising and writing source jobs.
#
# The job needs two repository secrets. Until they are configured it stays
# green and emits a warning annotation instead of failing twice a day, so the
# Actions tab only shows red for genuine breakage.
on:
  schedule:
    # Twice a day; source sites publish on no fixed schedule, and the importer
    # is idempotent because it purges and re-inserts source rows.
    - cron: "17 4,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-source-jobs
  cancel-in-progress: false

jobs:
  refresh:
    name: Import upstream job listings
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          # The project URL is public (it ships in the client bundle), so it has a
          # built-in default; only the service-role key must be a secret. Both the
          # canonical name and the short `supabase` alias are accepted so the job
          # works whichever name the secret was created under.
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://uwmhquvzbilbfzdrlxmb.supabase.co' }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.supabase }}
        run: |
          if [ -n "${SUPABASE_URL:-}" ] && [ -n "${SERVICE_KEY:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Source job refresh not configured::Add the SUPABASE_SERVICE_ROLE_KEY repository secret (Settings > Secrets and variables > Actions > Secrets) to enable the scheduled import. Skipping this run."
          fi

      - name: Check out source
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@v7

      - name: Set up Bun
        if: steps.config.outputs.configured == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install locked dependencies
        if: steps.config.outputs.configured == 'true'
        run: bun install --frozen-lockfile

      - name: Import source jobs
        if: steps.config.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL || 'https://uwmhquvzbilbfzdrlxmb.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.supabase }}
        run: bun run import:source-jobs
