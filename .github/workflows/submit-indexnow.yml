name: Submit sitemap to IndexNow

# Pings Bing and Yandex (via IndexNow) with every URL in the live sitemap so new
# vacancies are discovered within hours instead of waiting for the next crawl.
# Google ignores IndexNow and is handled by Search Console, so this is additive.
#
# The job is a no-op until the site is reachable, and it reads the key file from
# the deployed host, so it needs no repository secrets.
on:
  schedule:
    # Once a day, shortly after the source-job refresh windows (04:17 / 16:17 UTC).
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: submit-indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit sitemap URLs
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Diag egress
        run: |
          for u in "https://isbulkktc.com/sitemap.xml" "https://isbulkktc.com/" "https://isbulkktc-amber.vercel.app/sitemap.xml"; do
            echo "===== $u"
            curl -sS -o /dev/null -D - --max-time 25 "$u" 2>&1 | grep -iE "^HTTP/|^location:|^server:|^cf-|^x-vercel|^x-robots-tag|^content-type:|^retry-after:" | sed "s/^/  /"
          done
          echo "===== trace"
          curl -sS --max-time 25 https://isbulkktc.com/cdn-cgi/trace | grep -E "^(ip|loc|colo|warp)="
      - name: Submit the live sitemap
        # Read the sitemap from the canonical origin. Cloudflare's custom WAF
        # exempts /sitemap.xml and /robots.txt from bot and security-level
        # challenges, so datacenter egress (GitHub runners) reaches them without
        # the deployment alias. The alias is redirected to the canonical host, so
        # reading through it would only add a hop.
        run: node scripts/submit-indexnow.mjs https://isbulkktc.com
