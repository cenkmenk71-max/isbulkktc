<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>Doğrulama kodunuz</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #F5F2EB; margin: 0; padding: 0; color: #1A1A1A; }
    .container { max-width: 600px; margin: 24px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .header { background: #0D5C3A; padding: 28px 32px; }
    .header h1 { margin: 0; color: #ffffff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .header p { margin: 4px 0 0; color: rgba(255,255,255,0.85); font-size: 13px; }
    .body { padding: 32px; }
    .body h2 { margin: 0 0 12px; font-size: 18px; }
    .body p { margin: 0 0 16px; font-size: 15px; line-height: 1.6; }
    .code { font-size: 32px; font-weight: 700; letter-spacing: 6px; background-color: #F5F2EB; border-radius: 8px; padding: 18px; text-align: center; border: 1px solid rgba(0,0,0,0.06); }
    .footer { padding: 24px 32px; background: #fbfbfa; border-top: 1px solid #eeeeee; text-align: center; font-size: 12px; color: #6B7280; }
    .footer a { color: #0D5C3A; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>İşBul KKTC</h1>
      <p>Kuzey Kıbrıs'ın Güvenilir Kariyer ve İstihdam Ağı</p>
    </div>
    <div class="body">
      <h2>Doğrulama kodunuz</h2>
      <p>Devam etmek için aşağıdaki tek kullanımlık kodu girin. Kodu kimseyle paylaşmayın.</p>
      <p class="code">{{ .Token }}</p>
    </div>
    <div class="footer">
      <p>Bu kodu siz istemediyseniz yok sayabilirsiniz.</p>
      <p>Kuzey Kıbrıs Türk Cumhuriyeti · <a href="{{ .SiteURL }}">isbulkktc.com</a></p>
    </div>
  </div>
</body>
</html>
