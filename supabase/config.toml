project_id = "isbulkktc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-source-jobs.sql", "./seed-managed-content.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]
jwt_expiry = 3600
# Aligns with the application's zod schema (signUpSchema/updatePasswordSchema
# require 10) and the on-screen password hint.
# No composition rules are enforced on purpose: current guidance (NIST SP
# 800-63B) prefers length plus breached-password screening over character-class
# rules. Breached-password screening (HaveIBeenPwned) is a Pro-plan feature and
# the hosted project is on the free plan, where the API refuses to enable it
# (`402 entitlement_required`), so length is the only control in force.
minimum_password_length = 10
password_requirements = ""

# Identity-linking policy — the answer to #162's "same e-mail + social sign-in"
# question, decided explicitly rather than left to GoTrue's default. The two
# strategies (https://supabase.com/docs/guides/auth/auth-identity-linking):
#
#   * Automatic linking is GoTrue's built-in behaviour and is always on: a new
#     OAuth identity whose provider-verified e-mail matches an existing account
#     is attached to that account instead of creating a second one. Only
#     *verified* addresses link, so an unverified attacker cannot claim someone
#     else's account. This is the policy this project wants — one person, one
#     account, whichever button they press — and `public.profiles` is 1:1 with
#     `auth.users` regardless, so no duplicate profile can be produced.
#
#   * Manual linking (linkIdentity()) lets a signed-in user attach an identity
#     with a *different* address. No route in this app calls linkIdentity(), and
#     every account here is e-mail-scoped, so manual linking is attack surface
#     with no feature behind it. Keep it off; enabling it would also open the
#     `manual_linking_disabled` error path the app does not map.
enable_manual_linking = false
# Anonymous sign-ins are unused: every write path requires a confirmed session
# (`auth.uid()`), and no route calls `signInAnonymously`. Leaving this at the
# default `false` keeps an unauthenticated identity out of `auth.users`.
enable_anonymous_sign_ins = false

# Cloudflare Turnstile protects the auth forms on the hosted project
# (security_captcha_enabled = true, provider = turnstile). The local stack and CI
# keep it off so the E2E suite can drive the forms without solving a challenge.
# The `NEXT_PUBLIC_TURNSTILE_SITE_KEY` deployed with the app must pair with the
# hosted secret; a site key from another Turnstile widget makes every
# captcha-protected submit answer `captcha_failed`. Enable locally only when
# testing the captcha path:
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.mfa]
# The platform-admin console is gated on `aal2` (`has_platform_role` reads the
# `aal` claim), so TOTP must be enrollable or the gate can never be satisfied.
# The hosted project already runs with `mfa_totp_enroll_enabled = true`; without
# this block the local stack and CI default to `false`, which made every admin
# MFA flow — and therefore the whole console — untestable outside production.
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[auth.rate_limit]
# Bounds password-reset and signup-confirmation mail so the local stack mirrors
# the abuse limits the hosted project is expected to enforce.
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Requires a verified mailbox before a new account can sign in. The sign-up
# action already handles both the confirmed and pending branches.
enable_confirmations = true
# secure_password_change is deliberately left off. It gates updateUser({password})
# on a recent sign-in, and this repository's reset flow performs that update on a
# recovery session. Enable it only after verifying the recovery path on a
# non-production project (see docs/runbooks/production-launch.md).
secure_password_change = false
# Throttles repeated confirmation/recovery mail to the same address.
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Production SMTP for the auth mail (#195/#227).
#
# Without this block GoTrue sends auth mail (confirmation, recovery, magic_link,
# email_change, invite, reauthentication) through Supabase's built-in SMTP, whose
# SPF/DKIM do not align with `isbulkktc.com`, so the messages land in spam. Resend
# is already the transactional provider (`RESEND_API_KEY`), and its SMTP relay is
# the same domain the app sends from, so the auth mail becomes aligned.
#
# The section is `[auth.email.smtp]` — NOT `[auth.smtp]`. The CLI schema (v2.120.0)
# places SMTP under `[auth.email]`; an `[auth.smtp]` section is an unknown key the
# CLI **silently ignores**, so a block written that way configures nothing. This
# block is deliberately left **disabled** for two reasons:
#
#   * the local stack and CI must keep capturing auth mail in Mailpit (port
#     54324) — `tests/e2e/auth-flows.spec.ts` reads the confirmation link from
#     there, and pointing GoTrue at an external relay would starve it;
#   * `enabled = true` requires `host`, `port`, `user`, `pass` and `admin_email`,
#     so it must only be turned on where `RESEND_API_KEY` is a real key and the
#     domain is verified. On the hosted project those values are configured in
#     the Auth dashboard (or applied with `supabase config push`); this repo file
#     is the local/dev source of truth.
#
# To exercise the real path locally, uncomment `enabled` and export
# `RESEND_API_KEY`; `admin_email`/`sender_name` must come from the verified
# domain, and `port = 465` is Resend's implicit-TLS port.
# [auth.email.smtp]
# enabled = true
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "env(RESEND_API_KEY)"
# admin_email = "no-reply@isbulkktc.com"
# sender_name = "İşBul KKTC"

