project_id = "isbulkktc"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-source-jobs.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**"
]
jwt_expiry = 3600
# Aligns with the application's zod schema and the on-screen password hint.
# No composition rules are enforced on purpose: current guidance (NIST SP
# 800-63B) prefers length plus breached-password screening over character-class
# rules, which the hosted project enables in the Auth dashboard.
minimum_password_length = 8
password_requirements = ""

[auth.rate_limit]
# Bounds password-reset and signup-confirmation mail so the local stack mirrors
# the abuse limits the hosted project is expected to enforce.
email_sent = 30
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# Requires a verified mailbox before a new account can sign in. The sign-up
# action already handles both the confirmed and pending branches.
enable_confirmations = true
# secure_password_change is deliberately left off. It gates updateUser({password})
# on a recent sign-in, and this repository's reset flow performs that update on a
# recovery session. Enable it only after verifying the recovery path on a
# non-production project (see docs/runbooks/production-launch.md).
secure_password_change = false
# Throttles repeated confirmation/recovery mail to the same address.
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Subjects are Go templates too: GoTrue parses and executes them with the same
# data map as the body, so the subject line follows the recipient's `locale`
# metadata. The locale comparisons use backtick raw strings (Go template raw
# string literals) to keep every subject on a single TOML line.
[auth.email.template.confirmation]
subject = "{{- $lang := \"tr\" -}}{{- if .Data.locale }}{{ $lang = .Data.locale }}{{ end -}}{{ if eq $lang `en` }}İşBul KKTC — verify your email address{{ else if eq $lang `ru` }}İşBul KKTC — подтвердите адрес электронной почты{{ else if eq $lang `el` }}İşBul KKTC — επιβεβαιώστε τη διεύθυνση email σας{{ else if eq $lang `fa` }}İşBul KKTC — نشانی ایمیل خود را تأیید کنید{{ else if eq $lang `de` }}İşBul KKTC — E-Mail-Adresse bestätigen{{ else }}İşBul KKTC e-posta adresinizi doğrulayın{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{- $lang := \"tr\" -}}{{- if .Data.locale }}{{ $lang = .Data.locale }}{{ end -}}{{ if eq $lang `en` }}İşBul KKTC — reset your password{{ else if eq $lang `ru` }}İşBul KKTC — сброс пароля{{ else if eq $lang `el` }}İşBul KKTC — επαναφορά κωδικού πρόσβασης{{ else if eq $lang `fa` }}İşBul KKTC — بازنشانی رمز عبور{{ else if eq $lang `de` }}İşBul KKTC — Passwort zurücksetzen{{ else }}İşBul KKTC şifre yenileme bağlantınız{{ end }}"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.reauthentication]
subject = "{{- $lang := \"tr\" -}}{{- if .Data.locale }}{{ $lang = .Data.locale }}{{ end -}}{{ if eq $lang `en` }}İşBul KKTC — your verification code{{ else if eq $lang `ru` }}İşBul KKTC — ваш код подтверждения{{ else if eq $lang `el` }}İşBul KKTC — ο κωδικός επαλήθευσής σας{{ else if eq $lang `fa` }}İşBul KKTC — کد تأیید شما{{ else if eq $lang `de` }}İşBul KKTC — Ihr Bestätigungscode{{ else }}İşBul KKTC doğrulama kodunuz{{ end }}"
content_path = "./supabase/templates/reauthentication.html"

[auth.email.template.invite]
subject = "{{- $lang := \"tr\" -}}{{- if .Data.locale }}{{ $lang = .Data.locale }}{{ end -}}{{ if eq $lang `en` }}İşBul KKTC — your invitation{{ else if eq $lang `ru` }}İşBul KKTC — ваше приглашение{{ else if eq $lang `el` }}İşBul KKTC — η πρόσκλησή σας{{ else if eq $lang `fa` }}İşBul KKTC — دعوت‌نامه شما{{ else if eq $lang `de` }}İşBul KKTC — Ihre Einladung{{ else }}İşBul KKTC davetiniz{{ end }}"
content_path = "./supabase/templates/invite.html"

[auth.email.notification.password_changed]
enabled = true
subject = "{{- $lang := \"tr\" -}}{{- if .Data.locale }}{{ $lang = .Data.locale }}{{ end -}}{{ if eq $lang `en` }}İşBul KKTC — your password was changed{{ else if eq $lang `ru` }}İşBul KKTC — пароль изменён{{ else if eq $lang `el` }}İşBul KKTC — ο κωδικός άλλαξε{{ else if eq $lang `fa` }}İşBul KKTC — رمز عبور شما تغییر کرد{{ else if eq $lang `de` }}İşBul KKTC — Passwort geändert{{ else }}İşBul KKTC şifreniz güncellendi{{ end }}"
